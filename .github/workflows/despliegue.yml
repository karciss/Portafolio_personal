name: Publicación del portafolio

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portafolio-produccion
  cancel-in-progress: false

jobs:
  pruebas:
    name: Verificar aplicación
    uses: ./.github/workflows/pruebas.yml

  imagen:
    name: Publicar imagen en Docker Hub
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Comprobar credenciales de Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" && test -n "$DOCKERHUB_TOKEN" || { echo 'Faltan secretos DOCKERHUB_USERNAME o DOCKERHUB_TOKEN'; exit 1; }
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/carolina-portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/carolina-portfolio:${{ github.sha }}

  desplegar:
    name: Crear VM OCI y desplegar con Ansible
    needs: imagen
    runs-on: ubuntu-latest
    environment: produccion
    env:
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}
      OCI_STATE_BUCKET: ${{ vars.OCI_STATE_BUCKET }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}
      SITE_ADDRESS: ${{ vars.SITE_DOMAIN != '' && vars.SITE_DOMAIN || ':80' }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5
      - name: Comprobar parámetros OCI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
        run: |
          for value in "$OCI_REGION" "$OCI_TENANCY_OCID" "$OCI_USER_OCID" "$OCI_FINGERPRINT" "$TF_VAR_compartment_ocid" "$TF_VAR_ssh_public_key" "$OCI_STATE_BUCKET" "$OCI_NAMESPACE" "$OCI_PRIVATE_KEY" "$VM_SSH_PRIVATE_KEY"; do
            test -n "$value" || { echo 'Falta una variable o secreto OCI/SSH. Revisa README.md'; exit 1; }
          done
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/vm_ssh_key"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem" "$RUNNER_TEMP/vm_ssh_key"
          echo "OCI_PRIVATE_KEY_PATH=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
      - name: Autorizar SSH solo desde este runner
        run: |
          RUNNER_IP=$(curl --fail --silent --show-error https://api.ipify.org)
          echo "TF_VAR_ssh_allowed_cidr=$RUNNER_IP/32" >> "$GITHUB_ENV"
      - name: Preparar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - name: Iniciar backend remoto de Terraform
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config="bucket=$OCI_STATE_BUCKET" \
            -backend-config="namespace=$OCI_NAMESPACE" \
            -backend-config="key=carolina-portfolio/terraform.tfstate" \
            -backend-config="region=$OCI_REGION" \
            -backend-config="tenancy_ocid=$OCI_TENANCY_OCID" \
            -backend-config="user_ocid=$OCI_USER_OCID" \
            -backend-config="fingerprint=$OCI_FINGERPRINT" \
            -backend-config="private_key_path=$OCI_PRIVATE_KEY_PATH"
      - name: Validar infraestructura
        run: terraform -chdir=infra validate
      - name: Crear o actualizar VCN, subred y VM
        run: terraform -chdir=infra apply -input=false -auto-approve
      - name: Obtener IP pública
        id: vm
        run: echo "ip=$(terraform -chdir=infra output -raw public_ip)" >> "$GITHUB_OUTPUT"
      - name: Preparar Python para Ansible
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Ansible y colección UFW
        run: |
          python -m pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Actualizar DNS en Cloudflare si hay dominio
        if: vars.SITE_DOMAIN != '' && vars.CLOUDFLARE_ZONE_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: python scripts/cloudflare_dns.py
      - name: Configurar Docker, Git y firewall; desplegar aplicación
        env:
          ANSIBLE_SSH_COMMON_ARGS: '-o StrictHostKeyChecking=accept-new'
        run: |
          ansible-playbook -u ubuntu -i '${{ steps.vm.outputs.ip }},' \
            --private-key "$RUNNER_TEMP/vm_ssh_key" ansible/playbook.yml
      - name: Publicar URL gratuita de Cloudflare Quick Tunnel
        if: vars.SITE_DOMAIN == ''
        id: quick-tunnel
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          TUNNEL_URL=''
          for attempt in {1..24}; do
            TUNNEL_URL=$(ssh -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vm_ssh_key" "ubuntu@$PUBLIC_IP" 'sudo cat /var/lib/carolina-portfolio/quick-tunnel-url 2>/dev/null' 2>/dev/null || true)
            if [[ "$TUNNEL_URL" =~ ^https://[[:alnum:]-]+\.trycloudflare\.com$ ]]; then break; fi
            sleep 5
          done
          if [[ ! "$TUNNEL_URL" =~ ^https://[[:alnum:]-]+\.trycloudflare\.com$ ]]; then
            echo 'No se pudo obtener la URL del Quick Tunnel de Cloudflare.' >&2
            ssh -o StrictHostKeyChecking=accept-new -i "$RUNNER_TEMP/vm_ssh_key" "ubuntu@$PUBLIC_IP" 'sudo journalctl -u portfolio-quick-tunnel.service -n 40 --no-pager' || true
            exit 1
          fi
          echo "url=$TUNNEL_URL" >> "$GITHUB_OUTPUT"
          {
            echo '### URL gratuita de Cloudflare'
            echo
            echo "[$TUNNEL_URL]($TUNNEL_URL)"
            echo
            echo 'El Quick Tunnel se ejecuta como servicio en la VM. Su URL es temporal y puede cambiar si el proceso o la VM se reinician.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=URL de Cloudflare::$TUNNEL_URL"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 20 "$TUNNEL_URL/api/health"; then exit 0; fi
            sleep 5
          done
          echo 'La URL del Quick Tunnel no respondió correctamente.' >&2
          exit 1
      - name: Comprobar sitio publicado
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.ip }}
        run: |
          if [ "$SITE_ADDRESS" = ':80' ]; then URL="http://$PUBLIC_IP/api/health"; else URL="https://$SITE_ADDRESS/api/health"; fi
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "$URL"; then exit 0; fi
            sleep 10
          done
          echo 'El sitio no respondió por HTTP' >&2
          exit 1
