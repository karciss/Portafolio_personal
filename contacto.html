<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carolina Cisneros Arroyo - Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
    </div>
    
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-logo">Carolina Cisneros</div>
            <ul class="nav-links">
                <li><a href="home.html"><i class="fas fa-home"></i> Inicio</a></li>
                <li><a href="curriculum.html"><i class="fas fa-file-alt"></i> Curriculum</a></li>
                <li><a href="trabajos.html"><i class="fas fa-briefcase"></i> Trabajos</a></li>
                <li><a href="contacto.html" class="active"><i class="fas fa-envelope"></i> Contacto</a></li>
            </ul>
        </div>
    </nav>

    <main id="main-content" class="container">
        <section class="section">
            <h3 class="section-title">Contáctame</h3>
            <form id="contact-form" class="contact-container">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre">
                </div>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
                </div>
                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" name="asunto" required placeholder="Asunto del mensaje">
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Enviar mensaje</button>
            </form>
            <div id="contact-success" style="display:none; color:var(--green-dark); margin-top:20px; font-weight:500;"></div>

            <div style="margin-top:30px;">
                <h4 style="color:var(--violet-dark); margin-bottom:15px;">Información de contacto</h4>
                <p><i class="fas fa-envelope"></i> <a href="mailto:cisneroscarolina869@gmail.com">cisneroscarolina869@gmail.com</a></p>
                <p><i class="fas fa-phone"></i> 63735984</p>
                <p><i class="fas fa-map-marker-alt"></i> Calle J Prudencio Bustillos N 752, Sucre, Bolivia</p>
            </div>
        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <div>
                <p>&copy; 2025 Carolina Cisneros Arroyo</p>
                <p>Ingeniería de Sistemas Informáticos</p>
            </div>
            <div class="social-links">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>
    
    <script src="script.js"></script>
    <!-- La funcionalidad del formulario ahora se carga desde script.js -->
</body>
</html>
