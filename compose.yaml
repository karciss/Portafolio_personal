services:
  app:
    image: ${DOCKERHUB_USERNAME:-local}/carolina-portfolio:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_PATH: /app/data/portfolio.sqlite
    volumes:
      - portfolio_data:/app/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  portfolio_data:
  caddy_data:
  caddy_config:
